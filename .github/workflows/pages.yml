name: Test and deploy Ripple Circuit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser and offline tests
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
      - run: pnpm run build
        env:
          BASE_PATH: /ripple-circuit/
      - name: Verify the actual Pages subpath
        env:
          BASE_PATH: /ripple-circuit/
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ripple-circuit/ >/dev/null && break; sleep 1; done
          node scripts/pages-smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
